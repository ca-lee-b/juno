name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: pr_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d pr_agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/pr_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: docker build -f apps/backend/Dockerfile -t byo-pr-agent:ci .
      - name: Smoke test production API image
        run: |
          docker run --rm \
            -e API_TOKEN=ci-smoke-token-at-least-32-characters \
            -e DATABASE_URL=postgres://agent:agent@localhost:5432/pr_agent_test \
            -e REDIS_URL=redis://localhost:6379 \
            byo-pr-agent:ci node --input-type=module -e '
              await import("./dist/api/main.js");
              for (let attempt = 0; attempt < 20; attempt++) {
                try {
                  const response = await fetch("http://127.0.0.1:3000/health/live", {
                    signal: AbortSignal.timeout(1000),
                  });
                  if (response.ok) process.exit(0);
                } catch {}
                await new Promise(resolve => setTimeout(resolve, 250));
              }
              process.exit(1);
            '
